<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#081426">
  <meta name="description"
        content="Chase Bank — universal banking interface.">

  <title>Chase Bank | Banking Mode</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #081426;
      --panel: #101f36;
      --panel-light: #172943;
      --gold: #e5bf72;
      --gold-light: #f5dba2;
      --text: #f4f7fc;
      --muted: #96a8c4;
      --border: rgba(255,255,255,.09);
      --success: #55d6a2;
      --danger: #ff7e86;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(44, 82, 137, .34),
          transparent 40%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .container {
      width: min(100% - 32px, 500px);
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        0
        max(36px, env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 850;
      font-size: 18px;
      letter-spacing: 1.3px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #101a2a;
      background: linear-gradient(
        145deg,
        var(--gold-light),
        var(--gold)
      );
      box-shadow: 0 8px 24px rgba(229,191,114,.13);
      font-size: 20px;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(229,191,114,.24);
      background: rgba(229,191,114,.08);
      color: var(--gold-light);
      border-radius: 100px;
      padding: 8px 11px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .demo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    /* INTRO */

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(29px, 7vw, 39px);
      line-height: 1.12;
      letter-spacing: -1.3px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
      margin: 0;
    }

    /* PROGRESS */

    .progress {
      display: flex;
      align-items: flex-start;
      margin: 30px 0;
    }

    .progress-item {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .progress-item:not(:last-child)::after {
      content: "";
      position: absolute;
      height: 2px;
      background: var(--border);
      top: 17px;
      left: calc(50% + 22px);
      width: calc(100% - 44px);
    }

    .progress-item.complete:not(:last-child)::after {
      background: var(--gold);
    }

    .step-circle {
      width: 35px;
      height: 35px;
      margin: 0 auto 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .progress-item.active .step-circle,
    .progress-item.complete .step-circle {
      background: var(--gold);
      border-color: var(--gold);
      color: #111c2c;
    }

    .step-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-item.active .step-label,
    .progress-item.complete .step-label {
      color: var(--text);
    }

    /* PANELS */

    .panel {
      background: linear-gradient(
        150deg,
        rgba(22,41,67,.98),
        rgba(14,29,50,.98)
      );
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 65px rgba(0,0,0,.16);
      animation: enter .35s ease both;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(9px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel h2 {
      font-size: 20px;
      letter-spacing: -.4px;
      margin: 0 0 9px;
    }

    .panel-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin: 0 0 23px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 750;
      margin-bottom: 9px;
    }

    .input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(5,15,29,.45);
      padding: 14px;
      color: var(--text);
      font-size: 15px;
      transition: border-color .2s;
    }

    .input::placeholder {
      color: #7385a0;
    }

    .input:focus {
      border-color: var(--gold);
      outline: none;
    }

    .field-help {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      margin-top: 9px;
    }

    .error {
      color: var(--danger);
      font-size: 12px;
      margin: 12px 0 0;
      min-height: 17px;
    }

    /* BUTTONS */

    .button {
      width: 100%;
      min-height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(
        110deg,
        var(--gold-light),
        var(--gold)
      );
      color: #142036;
      font-weight: 850;
      font-size: 14px;
      margin-top: 19px;
      transition:
        transform .2s,
        filter .2s,
        opacity .2s;
    }

    .button:hover {
      filter: brightness(1.06);
    }

    .button:active {
      transform: scale(.985);
    }

    .button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .button-secondary {
      background: rgba(255,255,255,.035);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 11px;
    }

    /* ACCOUNT SUMMARY */

    .summary {
      margin: 20px 0;
      padding: 16px;
      border-radius: 15px;
      background: rgba(5,15,29,.32);
      border: 1px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      font-size: 12px;
      font-weight: 750;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
    }

    /* FICTIONAL CARD */

    .bank-card {
      min-height: 205px;
      padding: 23px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(
          circle at 100% 0,
          rgba(229,191,114,.28),
          transparent 44%
        ),
        linear-gradient(135deg,#203d63,#101b32 70%);
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 18px 35px rgba(0,0,0,.2);
      margin: 21px 0;
    }

    .bank-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -90px;
      bottom: -100px;
      border: 1px solid rgba(229,191,114,.3);
      border-radius: 50%;
      box-shadow:
        0 0 0 22px rgba(229,191,114,.04),
        0 0 0 44px rgba(229,191,114,.04);
      pointer-events: none;
    }

    .card-top,
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-brand {
      font-weight: 850;
      letter-spacing: 1.5px;
      font-size: 13px;
    }

    .card-chip {
      width: 36px;
      height: 27px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.4);
      background: linear-gradient(
        135deg,
        #e9d4a3,
        #a98d50
      );
      position: relative;
    }

    .card-chip::after {
      content: "";
      position: absolute;
      inset: 0 11px;
      border-left: 1px solid rgba(30,40,55,.35);
      border-right: 1px solid rgba(30,40,55,.35);
    }

    .card-number {
      font-size: 18px;
      letter-spacing: 3px;
      font-weight: 650;
      margin: 25px 0;
    }

    .card-caption {
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b8c6d9;
      font-size: 8px;
      margin-bottom: 7px;
    }

    .card-holder {
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .card-type {
      font-size: 11px;
      color: var(--gold-light);
      font-weight: 800;
    }

    /* SELECTIONS */

    .option {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      text-align: left;
      border: 1px solid var(--border);
      background: rgba(5,15,29,.3);
      color: var(--text);
      border-radius: 14px;
      transition: border-color .2s, background .2s;
    }

    .option:hover,
    .option.selected {
      border-color: var(--gold);
      background: rgba(229,191,114,.07);
    }

    .option-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: rgba(229,191,114,.1);
      color: var(--gold);
      border-radius: 12px;
      font-size: 18px;
    }

    .option-title {
      font-size: 13px;
      font-weight: 800;
      display: block;
    }

    .option-description {
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    /* LOADING */

    .loading {
      padding: 25px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 17px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* RESULT */

    .result {
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      border: 1px solid var(--border);
      background: rgba(5,15,29,.4);
      margin-top: 20px;
    }

    .result-icon {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      margin: 0 auto 15px;
      font-size: 25px;
      background: rgba(255,126,134,.1);
      color: var(--danger);
    }

    .result h3 {
      font-size: 19px;
      margin: 0 0 10px;
    }

    .result p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      margin: 0;
    }

    .result-label {
      display: inline-block;
      padding: 7px 10px;
      margin-top: 15px;
      border-radius: 8px;
      background: rgba(229,191,114,.08);
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      padding: 24px 8px 0;
    }

    .footer p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.8;
      margin: 0;
    }

    .footer strong {
      color: var(--gold-light);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 380px) {
      .container {
        width: min(100% - 22px, 500px);
      }

      .panel {
        padding: 19px;
      }

      .brand {
        font-size: 15px;
      }

      .demo-badge {
        font-size: 9px;
        padding: 7px;
      }

      .card-number {
        font-size: 15px;
        letter-spacing: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">P</div>
        <span>PHASE BANK</span>
      </div>

      <div class="demo-badge">
        <span class="demo-dot"></span>
        DEMO MODE
      </div>
    </header>

    <div class="eyebrow">Digital banking experience</div>

    <h1>Banking, reimagined.</h1>

    <p class="subtitle">
      Explore a modern banking verification experience
      through this interactive.
    </p>

    <div class="progress" aria-label="Demonstration progress">
      <div class="progress-item active" id="step1">
        <div class="step-circle">01</div>
        <div class="step-label">Account</div>
      </div>

      <div class="progress-item" id="step2">
        <div class="step-circle">02</div>
        <div class="step-label">Card</div>
      </div>

      <div class="progress-item" id="step3">
        <div class="step-circle">03</div>
        <div class="step-label">Result</div>
      </div>
    </div>

    <div id="app" aria-live="polite"></div>

    <footer class="footer">
      <p>
        <strong>CHASE BANK · INTERACTIVE Account</strong><br>
        real banking experience.
      </p>
    </footer>

  </main>

  <script>
    "use strict";

    /*
      CHASE BANK DEMO
      ----------------
      This application is a front-end demonstration only.

      It does not connect to a bank.
      It does not collect card PINs.
      It does not process financial transactions.
      All results are simulated locally.
    */

    const DEMO = Object.freeze({
      accountId: "DEMO-2045",
      customer: "Demo Customer",
      cardType: "GLB Type"
    });

    const app = document.getElementById("app");

    let currentStep = 1;
    let selectedCard = "";

    function render(html) {
      app.innerHTML = html;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function updateProgress(step) {
      currentStep = step;

      for (let i = 1; i <= 3; i++) {
        const item = document.getElementById("step" + i);

        item.classList.toggle("active", i === step);
        item.classList.toggle("complete", i < step);

        const circle = item.querySelector(".step-circle");

        circle.textContent = i < step ? "✓" :
          String(i).padStart(2, "0");
      }
    }

    function showWelcome() {
      updateProgress(1);
      selectedCard = "";

      render(`
        <section class="panel">
          <h2>Welcome to Chase Bank</h2>

          <p class="panel-description">
            Start the interactive dAccount to explore
            account verification and card-status
            workflow.
          </p>

          <div class="summary">
            <div class="summary-row">
              <span class="summary-label">Environment</span>
              <span class="summary-value">Demo only</span>
            </div>

            <div class="summary-row">
              <span class="summary-label">Verification</span>
              <span class="summary-value">Simulated</span>
            </div>

            <div class="summary-row">
              <span class="summary-label">Transactions</span>
              <span class="summary-value">Disabled</span>
            </div>
          </div>

          <button class="button" id="startButton">
            Start demonstration <span>→</span>
          </button>
        </section>
      `);

      document.getElementById("startButton")
        .addEventListener("click", showAccount);
    }

    function showAccount(error = "") {
      updateProgress(1);

      render(`
        <section class="panel">
          <div class="eyebrow">Step 01 of 03</div>

          <h2>Account verification</h2>

          <p class="panel-description">
            Enter the sample account ID displayed below
            to continue the demonstration.
          </p>

          <label class="field-label" for="account">
            Demo account ID
          </label>

          <input
            class="input"
            id="account"
            type="text"
            maxlength="30"
            autocomplete="off"
            spellcheck="false"
            placeholder="Enter demo account ID"
          >

          <p class="field-help">
            Sample account ID:
            <strong>${DEMO.accountId}</strong>
          </p>

          <p class="error" id="error" role="alert">
            ${escapeHTML(error)}
          </p>

          <button class="button" id="verifyAccount">
            Verify demo account <span>→</span>
          </button>

          <button class="button button-secondary" id="back">
            Back to welcome
          </button>
        </section>
      `);

      document.getElementById("back")
        .addEventListener("click", showWelcome);

      document.getElementById("verifyAccount")
        .addEventListener("click", verifyAccount);

      document.getElementById("account")
        .addEventListener("keydown", event => {
          if (event.key === "Enter") verifyAccount();
        });
    }

    function verifyAccount() {
      const input = document.getElementById("account");
      const value = input.value.trim();

      if (value !== DEMO.accountId) {
        document.getElementById("error").textContent =
          "Demo account ID not recognized. Use the sample ID shown above.";

        input.focus();
        return;
      }

      showLoading("Preparing demo account...", showAccountSuccess);
    }

    function showLoading(message, next) {
      render(`
        <section class="panel">
          <div class="loading">
            <div class="spinner" aria-hidden="true"></div>
            <div>${escapeHTML(message)}</div>
            <p class="field-help">
              Please wait while the demonstration advances.
            </p>
          </div>
        </section>
      `);

      window.setTimeout(next, 1000);
    }

    function showAccountSuccess() {
      updateProgress(1);

      render(`
        <section class="panel">
          <div class="eyebrow">Account overview</div>

          <h2>Demo account ready <span style="color:var(--success)">✓</span></h2>

          <p class="panel-description">
            The sample account has been recognized by the
            local demonstration.
          </p>

          <div class="summary">
            <div class="summary-row">
              <span class="summary-label">Account ID</span>
              <span class="summary-value">${DEMO.accountId}</span>
            </div>

            <div class="summary-row">
